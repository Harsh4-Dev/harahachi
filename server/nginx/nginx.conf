# Sekisho single-container front door.
#
# NOTE: this file is a TEMPLATE. docker-entrypoint.sh substitutes the
# __NGINX_PORT__ and __SEKISHO_PORT__ placeholders (from env, defaults 80/8420)
# and renders it to /tmp/nginx.conf, which nginx runs with `-c`. Rendering to
# /tmp (plus the pid + temp paths below) keeps the whole nginx runtime writable
# by a NON-root container user — no /run or /var writes, no host-permission
# assumptions.
#
# TLS is terminated by Cloudflare at the tunnel edge (real cert), so nginx here
# speaks plain HTTP. It:
#   /            -> the Harahachi PWA in /srv/app (SPA fallback)
#   /api/ /pair  -> 127.0.0.1:__SEKISHO_PORT__ (sekisho)
#   /admin       -> 127.0.0.1:__SEKISHO_PORT__
#   /llm/        -> 127.0.0.1:__SEKISHO_PORT__ (device-key gated vLLM passthrough)
# In TUNNEL=off / LAN mode the phone reaches this same port directly.

worker_processes auto;
error_log /dev/stderr warn;
# pid + all scratch paths under /tmp so a non-root USER can own them.
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 65;

    # Writable temp dirs under /tmp (default /var/lib/nginx is root-owned).
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Phone photos can be a few MB; allow generous multipart uploads.
    client_max_body_size 16m;

    upstream sekisho {
        server 127.0.0.1:__SEKISHO_PORT__;
    }

    server {
        listen __NGINX_PORT__;
        listen [::]:__NGINX_PORT__;
        server_name _;

        # --- Sekisho data + pairing API ---
        location /api/ {
            proxy_pass http://sekisho;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /pair/ {
            proxy_pass http://sekisho;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Admin dashboard ---
        location /admin {
            proxy_pass http://sekisho;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- OpenAI-compatible vLLM passthrough (device-key gated inside sekisho) ---
        location /llm/ {
            proxy_pass http://sekisho;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # --- The PWA (static build) with SPA fallback ---
        location / {
            root /srv/app;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
