<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#F3ECDA"/>
  <!-- vermillion hanko seal -->
  <rect x="96" y="96" width="320" height="320" rx="44" fill="#C73E3A"/>
  <rect x="120" y="120" width="272" height="272" rx="30" fill="none" stroke="#F3ECDA" stroke-width="10" opacity="0.55"/>
  <!-- kanji 本 (Honjin / home) -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
