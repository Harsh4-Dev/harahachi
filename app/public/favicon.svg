    <g fill="#E8A7B8">
      <ellipse cx="0" cy="-14" rx="9" ry="15"/>
      <ellipse cx="0" cy="-14" rx="9" ry="15" transform="rotate(72)"/>
      <ellipse cx="0" cy="-14" rx="9" ry="15" transform="rotate(144)"/>
      <ellipse cx="0" cy="-14" rx="9" ry="15" transform="rotate(216)"/>
      <ellipse cx="0" cy="-14" rx="9" ry="15" transform="rotate(288)"/>
    </g>
    <circle r="6" fill="#C9A227"/>
  </g>
</svg>
